<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo Giá Vận Tải</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.card{
background:#fff;
padding:18px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
margin-bottom:20px;
}

h3{
margin-bottom:15px;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:12px;
margin-bottom:10px;
}

.vehicle-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
}

.vehicle{
border:2px solid #eee;
padding:12px;
border-radius:14px;
cursor:pointer;
transition:.2s;
}

.vehicle:hover{
border-color:#4f46e5;
}

.vehicle.active{
border-color:#4f46e5;
background:#eef2ff;
}

#map{
height:300px;
border-radius:16px;
overflow:hidden;
}

.summary{
background:#4338ca;
color:#fff;
padding:20px;
border-radius:18px;
position:sticky;
top:20px;
}

.total{
font-size:34px;
font-weight:bold;
margin:10px 0;
}

.row{
display:flex;
justify-content:space-between;
margin:12px 0;
}

button{
width:100%;
padding:14px;
background:#16a34a;
border:none;
border-radius:14px;
color:#fff;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

@media(max-width:900px){
.layout{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="layout">

<div>

<div class="card">
<h3>Hàng hóa</h3>

<div class="grid2">
<input id="weight" type="number" placeholder="Khối lượng (tấn)">
<input id="volume" type="number" placeholder="Thể tích (m³)">
</div>

<div class="grid2">
<input placeholder="Dài">
<input placeholder="Rộng">
</div>

<input placeholder="Cao">
</div>

<div class="card">
<h3>Chọn xe</h3>

<div class="vehicle-list" id="vehicles"></div>
</div>

<div class="card">
<h3>Tuyến đường</h3>

<input placeholder="Điểm đi">
<input placeholder="Điểm đến">

<div id="map"></div>
</div>

</div>

<div>

<div class="summary">

<h3>TỔNG BÁO GIÁ</h3>

<div class="total" id="total">
0đ
</div>

<div class="row">
<span>Khoảng cách</span>
<span>36 km</span>
</div>

<div class="row">
<span>Thời gian</span>
<span>50 phút</span>
</div>

<hr style="margin:15px 0;border-color:rgba(255,255,255,.2)">

<label>
<input type="checkbox" id="vat">
 Xuất VAT
</label>

<button>Tạo đơn & điều phối</button>

</div>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const config = {
vehicles:[
{
label:"1 Tấn",
dim:"2.6×1.4×1.4",
vol:5.1,
priceBase:180000,
pricePerKm:17000
},
{
label:"2 Tấn",
dim:"4.2×1.8×1.8",
vol:14.4,
priceBase:250000,
pricePerKm:21000
},
{
label:"5 Tấn",
dim:"6.2×2.2×2.1",
vol:28.6,
priceBase:350000,
pricePerKm:32000
}
],
vat:0.15
};

let selectedVehicle=null;

const vehicleBox =
document.getElementById('vehicles');

config.vehicles.forEach(v=>{

const div=document.createElement('div');

div.className='vehicle';

div.innerHTML=`
<b>${v.label}</b>
<p>${v.dim}</p>
<p>${v.vol} m³</p>
`;

div.onclick=()=>{

document.querySelectorAll('.vehicle')
.forEach(e=>e.classList.remove('active'));

div.classList.add('active');

selectedVehicle=v;

calculate();
};

vehicleBox.appendChild(div);

});

function calculate(){

if(!selectedVehicle) return;

let total =
selectedVehicle.priceBase +
(selectedVehicle.pricePerKm * 36);

if(document.getElementById('vat').checked){
total += total * config.vat;
}

document.getElementById('total')
.innerText =
total.toLocaleString('vi-VN') + 'đ';
}

document.getElementById('vat')
.addEventListener('change',calculate);

const map = L.map('map')
.setView([21.0285,105.8542],10);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([21.0285,105.8542])
.addTo(map)
.bindPopup('Hà Nội');

</script>

</body>
</html>
